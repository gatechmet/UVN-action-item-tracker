    if(item.kind==='draft'){incoming=draftProvider(info)?.get(info);if(!incoming)throw Error('This draft is no longer pending. Save or refresh the tracker.');}
    else incoming=await readNamed(file);
    validateInfo(info,incoming);const current=await currentFor(info);

  async function writeResolution(id,record){
    await verify(dataDir);const fh=await dataDir.getFileHandle('conflictResolutions__'+id+'.json',{create:true}),w=await fh.createWritable();
    try{await w.write(JSON.stringify(record,null,1));await w.close()}catch(e){try{await w.abort()}catch{}throw e}
  }
  function validateMerged(info,record){
    if(record===undefined)throw Error('A missing record cannot replace the current record.');
    validateInfo(info,record);
    if(info.collection==='actions'){
      const objective=mapFor('objectives').get(record.objectiveId);
      if(!objective||objective.priorityId!==record.priorityId)throw Error('The chosen objective and priority do not match. Choose a matching pair.');
    }

    if(Object.values(VIRTUAL).includes(info.collection)){
      if(record.deleted)delete record.value;

    }
  }

      await verify(dataDir);const fresh=await inspectConflict(review.sourceFile);

        const c=review.info.collection;

  }
  const metricNames={bk_total:'Total bookings',svc:'Service',ppi:'PPI',rev:'Revenue',bk:'Bookings'};
  const conflictUI=window.createTrackerConflictUI({escape:esc,inspect:inspectConflict,apply:applyConflict,history:async()=>{if(!dataDir)throw Error('Connect to shared data first.');await readResolutions();return Core.copy(resolutions)},notify:m=>status(m,'ok'),metricLabel:k=>metricNames[k]||'',referenceLabel:(field,value)=>field==='objectiveId'?mapFor('objectives').get(value)?.name:field==='priorityId'?mapFor('priorities').get(value)?.name:'',title:(info,record)=>record?.title||record?.text?.slice(0,70)||(info?.route?`${info.year} · ${info.route.map(k=>metricNames[k]||k).join(' · ')}`:`${info.collection} ${info.id}`)});
  $('fs-issue-list').addEventListener('click',e=>{const b=e.target.closest('[data-review-conflict]');if(b)conflictUI.open(b.dataset.reviewConflict)});
  $('fs-resolution-history').addEventListener('click',()=>conflictUI.history());

  window.TrackerStore=Object.freeze({saveChanges,refresh:()=>poll(true),name:nameNow,setPending:()=>{$('fs-retry').hidden=!(window.trackerHasPending?.());if(window.trackerHasPending?.())status('You have changes waiting to save locally. Keep this tab open.','warn');else if(dataDir)status('All changes saved locally to the shared folder. OneDrive sync is not verified.','ok')},issue,resolveDataDir});
  $('fs-retry').addEventListener('click',()=>window.dispatchEvent(new Event('tracker-save-pending')));
  window.addEventListener('beforeunload',e=>{if(activeWrites||window.trackerHasPending?.()){e.preventDefault();e.returnValue=''}});
  let saved=null;
  async function useFolder(picked){const next=await resolveDataDir(picked);if(dataDir&&window.trackerHasPending?.())throw new Error('Save or copy your pending changes before changing folders.');dataDir=next;COLS.forEach(c=>cache[c].clear());errors.clear();await poll(true);const marker=JSON.parse(await(await(await dataDir.getFileHandle('uvnn-live-folder.json')).getFile()).text());for(const file of marker.unavailableSourceFiles||[])issue('Source copy: '+file.file,'This source file could not be copied. The live source has not been altered.');splash.hidden=true;readyResolve(true);status('Connected to shared data. Changes save locally; OneDrive sync is not verified.','ok');$('fs-pick').textContent='Choose a different shared folder…';$('fs-reconnect').hidden=true;clearInterval(timer);timer=setInterval(()=>poll().catch(e=>{issue('Folder connection',e.message);status('Could not refresh the shared folder. Your draft remains on screen.','warn')}),POLL_MS)}
  function fail(e){if(e.name==='AbortError')return;$('sp-msg').textContent=e.message;status(e.message,'warn')}
  async function pick(){$('sp-msg').textContent='';try{const h=await window.showDirectoryPicker({id:'uvnn-live-v3',mode:'readwrite'});await useFolder(h);saved=h;await remember(h)}catch(e){fail(e)}}
  async function reconnect(){try{if(await saved.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Allow access to the test folder to reconnect.');await useFolder(saved)}catch(e){fail(e)}}
  $('fs-pick').addEventListener('click',pick);$('sp-connect').addEventListener('click',pick);$('fs-reconnect').addEventListener('click',reconnect);$('sp-reconnect').addEventListener('click',reconnect);
  (async()=>{if(!('showDirectoryPicker'in window)){$('sp-connect').disabled=true;status('Open the tracker HTML from File Explorer in Edge or Chrome.','warn');return}saved=await savedHandle();if(saved){$('fs-reconnect').hidden=false;$('sp-reconnect').hidden=false;try{if(await saved.queryPermission({mode:'readwrite'})==='granted')await useFolder(saved)}catch(e){fail(e)}}})();
})();
